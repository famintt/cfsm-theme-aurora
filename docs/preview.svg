<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aurora — CF-Server-Monitor 第三方主题">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.55" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#080C18"/>
    </linearGradient>

    <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4BE3B0"/>
      <stop offset="1" stop-color="#4BE3B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B06BFF"/>
      <stop offset="1" stop-color="#B06BFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="0.55" stop-color="#A9C2FF"/>
      <stop offset="1" stop-color="#C6A8FF"/>
    </linearGradient>

    <linearGradient id="barGood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4BE3B0"/>
      <stop offset="1" stop-color="#5EC8FF"/>
    </linearGradient>

    <filter id="blurA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blurB" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <clipPath id="cardClip"><rect x="620" y="120" width="500" height="400" rx="26"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- aurora glow -->
  <g filter="url(#blurA)">
    <ellipse cx="180" cy="90" rx="380" ry="150" fill="url(#auroraA)"/>
    <ellipse cx="520" cy="40" rx="430" ry="130" fill="url(#auroraB)"/>
    <ellipse cx="980" cy="40" rx="420" ry="150" fill="url(#auroraC)"/>
  </g>
  <g filter="url(#blurB)" opacity="0.55">
    <path d="M-40 210 C 220 120, 420 250, 660 150 C 860 68, 1010 190, 1240 110 L1240 0 L-40 0 Z" fill="url(#auroraB)" opacity="0.45"/>
  </g>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <path d="M0 158 H1200 M0 472 H1200"/>
    <path d="M80 0 V630 M1120 0 V630"/>
  </g>

  <!-- left column -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif">
    <g transform="translate(80,120)">
      <rect x="0" y="0" width="286" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="16" y="22" font-size="13" letter-spacing="1.6" fill="#9FB4D8">CF-SERVER-MONITOR · 第三方主题</text>
    </g>

    <text x="74" y="272" font-size="104" font-weight="700" letter-spacing="-2" fill="url(#titleGrad)">Aurora</text>

    <text x="80" y="326" font-size="22" fill="#B9C6DE">极光配色 · 实时监控 · 墨水屏视图</text>

    <g fill="#8FA3C4" font-size="16">
      <g transform="translate(80,372)">
        <rect x="0" y="-16" width="150" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text x="18" y="9">监控首页 /#/</text>
      </g>
      <g transform="translate(246,372)">
        <rect x="0" y="-16" width="176" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text x="18" y="9">详情 /#/server/:id</text>
      </g>
      <g transform="translate(80,428)">
        <rect x="0" y="-16" width="196" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text x="18" y="9">墨水屏 /#/epaper</text>
      </g>
      <g transform="translate(292,428)">
        <rect x="0" y="-16" width="150" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
        <text x="18" y="9">中 / EN</text>
      </g>
    </g>

    <text x="80" y="536" font-size="15" fill="#6C7C99">index.html + assets/ · 约 240 KB · 无需构建</text>
  </g>

  <!-- right panel: abstract dashboard wireframe -->
  <g clip-path="url(#cardClip)">
    <rect x="620" y="120" width="500" height="400" rx="26" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.10"/>

    <!-- four summary tiles -->
    <g fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.08">
      <rect x="644" y="146" width="104" height="66" rx="12"/>
      <rect x="760" y="146" width="104" height="66" rx="12"/>
      <rect x="876" y="146" width="104" height="66" rx="12"/>
      <rect x="992" y="146" width="104" height="66" rx="12"/>
    </g>
    <g fill="#5E6F90">
      <rect x="660" y="162" width="40" height="6" rx="3"/>
      <rect x="776" y="162" width="46" height="6" rx="3"/>
      <rect x="892" y="162" width="34" height="6" rx="3"/>
      <rect x="1008" y="162" width="44" height="6" rx="3"/>
    </g>
    <g fill="#DCE7FA" font-family="Inter, 'Noto Sans CJK SC', system-ui, sans-serif" font-size="18" font-weight="600">
      <text x="660" y="196">12/12</text>
      <text x="776" y="196">HK-01</text>
      <text x="892" y="196">3.4T</text>
      <text x="1008" y="196">86M</text>
    </g>

    <!-- two cards -->
    <g>
      <rect x="644" y="228" width="212" height="128" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="664" y="248" width="52" height="8" rx="4" fill="#8FA3C4" fill-opacity="0.55"/>
      <g fill="#FFFFFF" fill-opacity="0.07">
        <rect x="664" y="276" width="172" height="8" rx="4"/>
        <rect x="664" y="296" width="172" height="8" rx="4"/>
        <rect x="664" y="316" width="172" height="8" rx="4"/>
      </g>
      <rect x="664" y="276" width="120" height="8" rx="4" fill="url(#barGood)" opacity="0.85"/>
      <rect x="664" y="296" width="86" height="8" rx="4" fill="url(#barGood)" opacity="0.65"/>
      <rect x="664" y="316" width="140" height="8" rx="4" fill="url(#barGood)" opacity="0.75"/>
    </g>
    <g>
      <rect x="872" y="228" width="212" height="128" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="892" y="248" width="64" height="8" rx="4" fill="#8FA3C4" fill-opacity="0.55"/>
      <path d="M892 330 L916 318 L940 324 L964 302 L988 310 L1012 292 L1036 300 L1060 280"
            fill="none" stroke="#5EC8FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
      <path d="M892 336 L916 332 L940 336 L964 326 L988 332 L1012 320 L1036 328 L1060 316"
            fill="none" stroke="#B06BFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- second row of cards -->
    <g>
      <rect x="644" y="372" width="212" height="124" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="682" cy="418" r="20" fill="none" stroke="#4BE3B0" stroke-width="3" stroke-opacity="0.8" stroke-dasharray="88 38" stroke-linecap="round" transform="rotate(-90 682 418)"/>
      <rect x="716" y="402" width="112" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.10"/>
      <rect x="716" y="422" width="76" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.07"/>
      <rect x="664" y="460" width="164" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.06"/>
      <rect x="664" y="460" width="98" height="8" rx="4" fill="url(#barGood)" opacity="0.5"/>
    </g>
    <g>
      <rect x="872" y="372" width="212" height="124" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <rect x="892" y="392" width="58" height="8" rx="4" fill="#8FA3C4" fill-opacity="0.55"/>
      <g fill="#FFFFFF" fill-opacity="0.10">
        <rect x="892" y="414" width="172" height="6" rx="3"/>
        <rect x="892" y="430" width="172" height="6" rx="3"/>
        <rect x="892" y="446" width="172" height="6" rx="3"/>
      </g>
      <rect x="892" y="414" width="132" height="6" rx="3" fill="url(#barGood)" opacity="0.7"/>
      <rect x="892" y="430" width="88" height="6" rx="3" fill="url(#barGood)" opacity="0.55"/>
      <rect x="892" y="446" width="150" height="6" rx="3" fill="url(#barGood)" opacity="0.6"/>
    </g>
  </g>

  <!-- edge fade -->
  <rect width="1200" height="630" fill="none"/>
</svg>
